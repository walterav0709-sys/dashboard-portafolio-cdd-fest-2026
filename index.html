<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Dashboard interactivo del Portafolio de Proyectos CdD-FEST 2026"
    />
    <title>Acceso al Portafolio de proyectos CdD-FEST</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --red: #d71920;
        --red-dark: #a80f15;
        --ink: #272727;
        --muted: #666;
        --line: #dedede;
        --canvas: #f3f3f3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(circle at 15% 15%, rgba(215, 25, 32, 0.1), transparent 30rem),
          linear-gradient(145deg, #fafafa, var(--canvas));
        color: var(--ink);
      }

      .login-shell {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-card {
        width: min(100%, 420px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(24, 24, 24, 0.14);
      }

      .brand-bar {
        height: 8px;
        background: var(--red);
      }

      .login-content {
        padding: 36px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--red);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 5vw, 2rem);
        line-height: 1.15;
      }

      .intro {
        margin: 12px 0 26px;
        color: var(--muted);
        line-height: 1.55;
      }

      label {
        display: block;
        margin: 0 0 7px;
        font-size: 0.82rem;
        font-weight: 750;
      }

      input {
        width: 100%;
        min-height: 46px;
        margin: 0 0 18px;
        padding: 10px 13px;
        border: 1px solid #cfcfcf;
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }

      input:focus {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.12);
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        background: var(--red);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        transition: background 0.18s ease, transform 0.18s ease;
      }

      button:hover {
        background: var(--red-dark);
      }

      button:active {
        transform: translateY(1px);
      }

      .error {
        min-height: 22px;
        margin: 14px 0 0;
        color: var(--red-dark);
        font-size: 0.86rem;
        text-align: center;
      }

      .footer-note {
        margin: 18px 0 0;
        color: #777;
        font-size: 0.76rem;
        line-height: 1.45;
        text-align: center;
      }

      .dashboard-frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--canvas);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 480px) {
        .login-shell {
          padding: 14px;
        }

        .login-content {
          padding: 28px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-shell" id="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-bar"></div>
        <div class="login-content">
          <p class="eyebrow">CdD-FEST 2026</p>
          <h1 id="login-title">Acceso al dashboard</h1>
          <p class="intro">Ingrese sus credenciales para revisar el portafolio de proyectos.</p>

          <form id="login-form">
            <label for="username">Usuario</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              autofocus
            />

            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />

            <button type="submit">Ingresar</button>
            <p class="error" id="login-error" role="alert" aria-live="polite"></p>
          </form>

          <p class="footer-note">Dirección de Estadística, Seguimiento y Evaluación</p>
        </div>
      </section>
    </main>

    <iframe
      class="dashboard-frame"
      id="dashboard-frame"
      title="Dashboard del Portafolio de Proyectos CdD-FEST"
      hidden
    ></iframe>

    <noscript>Debe habilitar JavaScript para ingresar al dashboard.</noscript>

    <script>
      (() => {
        const expectedHash = "6899bc9d81290b95f860bf1d69995ab93d9531fb2bdf517c2577e5e361c31e8d";
        const loginShell = document.getElementById("login-shell");
        const loginForm = document.getElementById("login-form");
        const username = document.getElementById("username");
        const password = document.getElementById("password");
        const error = document.getElementById("login-error");
        const dashboard = document.getElementById("dashboard-frame");

        const hash = async (value) => {
          const data = new TextEncoder().encode(value);
          const digest = await crypto.subtle.digest("SHA-256", data);
          return Array.from(new Uint8Array(digest))
            .map((byte) => byte.toString(16).padStart(2, "0"))
            .join("");
        };

        const openDashboard = () => {
          dashboard.src = "./public/dashboard_portafolio_ptp.html?v=083ca8c0c34f";
          loginShell.hidden = true;
          dashboard.hidden = false;
          document.title = "Portafolio de proyectos CdD-FEST";
        };

        if (sessionStorage.getItem("dashboard-access") === "granted") {
          openDashboard();
        }

        loginForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          error.textContent = "";

          const submittedHash = await hash(`${username.value}:${password.value}`);
          password.value = "";

          if (submittedHash === expectedHash) {
            sessionStorage.setItem("dashboard-access", "granted");
            openDashboard();
            return;
          }

          error.textContent = "Usuario o contraseña incorrectos.";
          password.focus();
        });
      })();
    </script>
  </body>
</html>
